<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Spend-Guard agent routing tree</title>
  <desc id="desc">Animated routing tree. A request starts on the cheap main agent, then the matching branch lights: stay cheap, developer, reviewer, extractor with checker, or a fresh Luna chat at 100k tokens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#102A2A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="620" rx="28" fill="url(#bg)"/>
  <text x="48" y="42" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Agent routing</text>
  <text x="48" y="66" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Cheap main first. One branch lights. Then a fresh chat at 100k.</text>
  <g fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round">
    <path d="M480 126 V154"/>
    <path d="M480 226 V268"/>
    <path d="M128 268 H832"/>
    <path d="M128 268 V300"/>
    <path d="M360 268 V300"/>
    <path d="M592 268 V300"/>
    <path d="M832 268 V300"/>
    <path d="M832 392 V412"/>
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 226 V268 H128 V300" stroke="#22C55E">
      <animate attributeName="stroke-opacity" values="1;1;0.15;0.15;0.15;1" keyTimes="0;0.18;0.22;0.88;0.96;1" dur="16s" repeatCount="indefinite"/>
    </path>
    <path d="M480 226 V268 H360 V300" stroke="#38BDF8" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.18;0.22;0.40;0.44;1" dur="16s" repeatCount="indefinite"/>
    </path>
    <path d="M480 226 V268 H592 V300" stroke="#F59E0B" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.40;0.44;0.58;0.62;1" dur="16s" repeatCount="indefinite"/>
    </path>
    <path d="M480 226 V268 H832 V300" stroke="#F59E0B" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.58;0.62;0.82;0.86;1" dur="16s" repeatCount="indefinite"/>
    </path>
    <path d="M832 392 V412" stroke="#A78BFA" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.70;0.74;0.82;0.86;1" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="330" y="84" width="300" height="42" rx="14" fill="#1E293B" stroke="#334155"/>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700">run the tests
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.18;0.22;0.40;0.58;0.82;0.86;0.96;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700" opacity="0">fix auth login
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.18;0.22;0.40;0.44;0.58;0.82;0.96;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700" opacity="0">review before push
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.22;0.40;0.44;0.48;0.58;0.62;0.96;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700" opacity="0">read this invoice
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.44;0.58;0.62;0.66;0.82;0.86;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="110" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700" opacity="0">keep going...
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.62;0.82;0.86;0.90;0.96;1" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="300" y="154" width="360" height="72" rx="16" fill="#0F766E" stroke="#2DD4BF"/>
    <text x="480" y="182" text-anchor="middle" fill="#CCFBF1" font-size="12">CHEAP MAIN · e.g. GPT-5.6 Luna</text>
    <text x="480" y="206" text-anchor="middle" fill="#F0FDFA" font-size="16" font-weight="700">route every request here first</text>
  </g>
  <circle r="8" fill="#38BDF8" filter="url(#glow)">
    <animate attributeName="cx" dur="16s" repeatCount="indefinite" keyTimes="0;0.06;0.10;0.18;0.22;0.28;0.32;0.40;0.44;0.50;0.54;0.58;0.62;0.68;0.74;0.82;0.86;0.92;0.96;1" values="480;480;128;128;480;480;360;360;480;480;592;592;480;480;832;832;832;480;480;480"/>
    <animate attributeName="cy" dur="16s" repeatCount="indefinite" keyTimes="0;0.06;0.10;0.18;0.22;0.28;0.32;0.40;0.44;0.50;0.54;0.58;0.62;0.68;0.74;0.82;0.86;0.92;0.96;1" values="105;247;268;346;190;247;268;346;190;247;268;346;190;247;268;346;448;190;552;105"/>
  </circle>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(40,300)">
      <rect width="176" height="92" rx="14" fill="url(#card)" stroke="#22C55E" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;1;0.25;0.25;0.25;1" keyTimes="0;0.18;0.22;0.88;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="88" y="28" text-anchor="middle" fill="#86EFAC" font-size="11">STAY</text>
      <text x="88" y="52" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">tests, docs, git</text>
      <text x="88" y="74" text-anchor="middle" fill="#94A3B8" font-size="11">e.g. Luna / nano</text>
    </g>
    <g transform="translate(272,300)">
      <rect width="176" height="92" rx="14" fill="url(#card)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.18;0.22;0.40;0.44;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="88" y="28" text-anchor="middle" fill="#7DD3FC" font-size="11">DEVELOPER</text>
      <text x="88" y="52" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">write / fix code</text>
      <text x="88" y="74" text-anchor="middle" fill="#94A3B8" font-size="11">e.g. Sonnet / Sol / Grok</text>
    </g>
    <g transform="translate(504,300)">
      <rect width="176" height="92" rx="14" fill="url(#card)" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.40;0.44;0.58;0.62;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="88" y="28" text-anchor="middle" fill="#FCD34D" font-size="11">REVIEWER</text>
      <text x="88" y="52" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">before a push</text>
      <text x="88" y="74" text-anchor="middle" fill="#94A3B8" font-size="11">e.g. Opus 5.5</text>
    </g>
    <g transform="translate(736,300)">
      <rect width="184" height="92" rx="14" fill="url(#card)" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.58;0.62;0.82;0.86;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="28" text-anchor="middle" fill="#FCD34D" font-size="11">EXTRACTOR</text>
      <text x="92" y="52" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">costly misreads</text>
      <text x="92" y="74" text-anchor="middle" fill="#94A3B8" font-size="11">e.g. Opus 5.5</text>
    </g>
    <g transform="translate(736,412)">
      <rect width="184" height="80" rx="14" fill="url(#card)" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.25">
        <animate attributeName="stroke-opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.70;0.74;0.82;0.86;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="92" y="28" text-anchor="middle" fill="#DDD6FE" font-size="11">CHECKER</text>
      <text x="92" y="52" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">second pass</text>
      <text x="92" y="70" text-anchor="middle" fill="#94A3B8" font-size="11">e.g. Astra / Grok / Sol</text>
    </g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="520" width="880" height="64" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2">
      <animate attributeName="fill" values="#1E293B;#1E293B;#14532D;#14532D;#1E293B" keyTimes="0;0.82;0.86;0.96;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#334155;#334155;#22C55E;#22C55E;#334155" keyTimes="0;0.82;0.86;0.96;1" dur="16s" repeatCount="indefinite"/>
    </rect>
    <text x="480" y="546" text-anchor="middle" fill="#94A3B8" font-size="13">ANY BRANCH · ~100k tokens</text>
    <text x="480" y="568" text-anchor="middle" fill="#F8FAFC" font-size="15" font-weight="700">notes.md → create_session → e.g. GPT-5.6 Luna</text>
  </g>
</svg>
